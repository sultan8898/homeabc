name: deploy
on:
  push:
    branches:
      - 2ndcommit 

jobs:
  new-version-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Updated to v4
        with:
          fetch-depth: 0

      - name: Deploy with rsync
        env:
          dest: "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_PATH }}"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # This command syncs the current folder to your server
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --exclude '.git*' --exclude '.github*' ./ ${{ env.dest }}
